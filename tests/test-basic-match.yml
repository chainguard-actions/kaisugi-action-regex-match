name: Test basic regex match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          text: "hello world"
          regex: "hello"
      - name: Assert match output
        env:
          ACTUAL: ${{ steps.action.outputs.match }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello" ]; then
            echo "FAIL: expected 'hello' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
