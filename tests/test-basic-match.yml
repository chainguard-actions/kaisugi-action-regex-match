name: Test basic regex match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          text: "Hello, World!"
          regex: "Hello"
      - name: Assert match output
        env:
          MATCH: ${{ steps.action.outputs.match }}
        run: |
          echo "match: $MATCH"
          if [ "$MATCH" != "Hello" ]; then
            echo "FAIL: expected 'Hello' but got '$MATCH'"
            exit 1
          fi
          echo "PASS"
