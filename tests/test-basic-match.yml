name: Test basic regex match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          text: "Hello, World!"
          regex: "Hello, (.+)!"
      - name: Assert match output
        env:
          ACTUAL: ${{ steps.action.outputs.match }}
        run: |
          echo "actual match: $ACTUAL"
          if [ "$ACTUAL" != "Hello, World!" ]; then
            echo "FAIL: expected 'Hello, World!' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert group1 output
        env:
          ACTUAL: ${{ steps.action.outputs.group1 }}
        run: |
          echo "actual group1: $ACTUAL"
          if [ "$ACTUAL" != "World" ]; then
            echo "FAIL: expected 'World' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
