name: Test regex match with flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-case-insensitive
        uses: .
        with:
          text: "Hello, World!"
          regex: "hello"
          flags: "i"
      - name: Assert case-insensitive match works
        env:
          MATCH: ${{ steps.action-case-insensitive.outputs.match }}
        run: |
          echo "match: $MATCH"
          if [ "$MATCH" != "Hello" ]; then
            echo "FAIL: expected 'Hello' with case-insensitive flag but got '$MATCH'"
            exit 1
          fi
          echo "PASS"
      - id: action-no-flag
        uses: .
        with:
          text: "Hello, World!"
          regex: "hello"
      - name: Assert case-sensitive match fails without flag
        env:
          MATCH: ${{ steps.action-no-flag.outputs.match }}
        run: |
          echo "match: '$MATCH'"
          if [ -n "$MATCH" ]; then
            echo "FAIL: expected empty match without case-insensitive flag but got '$MATCH'"
            exit 1
          fi
          echo "PASS"
