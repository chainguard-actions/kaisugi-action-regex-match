name: Test regex no match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          text: "Hello, World!"
          regex: "^\\d+$"
      - name: Assert match is empty when no match
        env:
          MATCH: ${{ steps.action.outputs.match }}
          GROUP1: ${{ steps.action.outputs.group1 }}
        run: |
          echo "match: '$MATCH'"
          echo "group1: '$GROUP1'"
          if [ -n "$MATCH" ]; then
            echo "FAIL: expected empty match but got '$MATCH'"
            exit 1
          fi
          if [ -n "$GROUP1" ]; then
            echo "FAIL: expected empty group1 but got '$GROUP1'"
            exit 1
          fi
          echo "PASS"
