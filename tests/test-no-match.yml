name: Test regex no match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          text: "Hello, World!"
          regex: "^Goodbye"
      - name: Assert match output is empty
        env:
          ACTUAL: ${{ steps.action.outputs.match }}
        run: |
          echo "actual match: '$ACTUAL'"
          if [ "$ACTUAL" != "" ]; then
            echo "FAIL: expected empty string but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
